# Source: lightweight-monitoring-stack/templates/prometheus.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
    helm.sh/chart: lightweight-monitoring-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "3.0.0"
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
  
    rule_files:
      - /etc/prometheus/alerts.yml
  
    scrape_configs:
      - job_name: 'demo-app'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['demo-app-svc.app.svc:8000']
            labels:
              app: 'demo-app'
              environment: 'helm-deploy'
              namespace: 'app'
      - job_name: 'load-generator'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['load-generator-svc.app.svc:8089']
            labels:
              app: 'load-generator'
              environment: 'helm-deploy'
              namespace: 'app'
  
      - job_name: 'prometheus'
        scrape_interval: 15s
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'kube-state-metrics'
        scrape_interval: 15s
        static_configs:
          - targets: ['kube-state-metrics-svc.monitoring.svc:8080']
      - job_name: 'kubelet-resource'
        scrape_interval: 15s
        scheme: https
        metrics_path: /metrics/resource
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
  
  alerts.yml: |
    groups:
      - name: demo-app-alerts
        rules:
          - alert: HighErrorRate
            expr: sum(rate(http_requests_total{status_code=~"5.*"}[1m])) / sum(rate(http_requests_total[1m])) > 0.1
            for: 15s
            labels:
              severity: warning
            annotations:
              summary: "High error rate detected (>10% 5xx errors)"
              description: "App error rate exceeded threshold."
  
          - alert: LatencySpike
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 0.8
            for: 15s
            labels:
              severity: warning
            annotations:
              summary: "p95 Latency spike (>800ms)"
              description: "App response time is degraded."
  
          - alert: LoadGenHighErrorRate
            expr: sum(rate(loadgen_errors_total[1m])) / sum(rate(loadgen_requests_total[1m])) > 0.15
            for: 20s
            labels:
              severity: warning
            annotations:
              summary: "Load Generator reports elevated failure rate (>15%)"
              description: "Client-side errors exceed threshold during load test."
