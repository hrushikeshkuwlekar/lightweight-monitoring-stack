apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: 'demo-app'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['demo-app-svc.app.svc.cluster.local:8000']
            labels:
              app: 'demo-app'
              environment: 'local-laptop'
              namespace: 'app'

      - job_name: 'load-generator'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['load-generator-svc.app.svc.cluster.local:8089']
            labels:
              app: 'load-generator'
              environment: 'local-laptop'
              namespace: 'app'

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics-svc.monitoring.svc.cluster.local:8080']

      - job_name: 'kubelet'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      - job_name: 'cadvisor'
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

  alerts.yml: |
    groups:
      - name: demo-app-alerts
        rules:
          - alert: HighErrorRate
            expr: sum(rate(http_requests_total{status_code=~"5.*"}[1m])) / sum(rate(http_requests_total[1m])) > 0.1
            for: 15s
            labels:
              severity: warning
            annotations:
              summary: "High error rate detected (>10% 5xx errors)"
              description: "App error rate exceeded threshold."

          - alert: LatencySpike
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 0.8
            for: 15s
            labels:
              severity: warning
            annotations:
              summary: "p95 Latency spike (>800ms)"
              description: "App response time is degraded."

          - alert: LoadGenHighErrorRate
            expr: sum(rate(loadgen_errors_total[1m])) / sum(rate(loadgen_requests_total[1m])) > 0.15
            for: 20s
            labels:
              severity: warning
            annotations:
              summary: "Load Generator reports elevated failure rate (>15%)"
              description: "Client-side errors exceed threshold during load test."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
          - "--storage.tsdb.retention.time=2h"
          - "--storage.tsdb.retention.size=100MB"
          - "--storage.tsdb.min-block-duration=2h"
          - "--storage.tsdb.max-block-duration=2h"
          - "--query.max-samples=200000"
          - "--web.enable-lifecycle"
        ports:
        - containerPort: 9090
          name: web
        resources:
          requests:
            cpu: 30m
            memory: 60Mi
          limits:
            cpu: 200m
            memory: 120Mi
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: LoadBalancer
  ports:
  - port: 9090
    targetPort: 9090
    name: web
  selector:
    app: prometheus
