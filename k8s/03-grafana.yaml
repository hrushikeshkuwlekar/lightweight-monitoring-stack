              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              }
            }
          }
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["monitoring", "demo", "app"],
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m"]
