              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 70
              },
              "unit": "ops"
            }
          }
        },
        {
          "id": 9,
          "title": "Total Processed Value (USD)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 16 },
          "targets": [
            {
              "expr": "sum(app_orders_value_usd_total) or vector(0)",
