apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: monitoring
  labels:
    app: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
      - name: load-generator
        image: load-generator:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8089
          name: http
        env:
        - name: TARGET_URL
          value: "http://demo-app-svc:8000"
        resources:
          requests:
            cpu: 20m
            memory: 40Mi
          limits:
            cpu: 200m
            memory: 100Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8089
          initialDelaySeconds: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8089
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: load-generator-svc
  namespace: monitoring
  labels:
    app: load-generator
spec:
  type: LoadBalancer
  ports:
  - port: 8089
    targetPort: 8089
    name: http
  selector:
    app: load-generator
