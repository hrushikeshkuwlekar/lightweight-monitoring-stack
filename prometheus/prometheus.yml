global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'demo-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['demo-app:8000']
        labels:
          app: 'demo-app'
          environment: 'docker-compose'

  - job_name: 'load-generator'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['load-generator:8089']
        labels:
          app: 'load-generator'
          environment: 'docker-compose'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
