{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ .Values.namespaces.monitoring | default .Release.Namespace }}
  labels:
    app: prometheus
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "lightweight-monitoring-stack.fullname" . }}-prometheus
  labels:
    app: prometheus
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/metrics
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs:
  - /metrics
  - /metrics/cadvisor
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "lightweight-monitoring-stack.fullname" . }}-prometheus
  labels:
    app: prometheus
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "lightweight-monitoring-stack.fullname" . }}-prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: {{ .Values.namespaces.monitoring | default .Release.Namespace }}
{{- end }}
