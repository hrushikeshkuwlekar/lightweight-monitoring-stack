{{- if .Values.namespaces.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.app }}
  labels:
    name: {{ .Values.namespaces.app }}
    tier: application
    {{- if .Values.podSecurity.enforce }}
    pod-security.kubernetes.io/enforce: {{ .Values.podSecurity.level }}
    pod-security.kubernetes.io/enforce-version: {{ .Values.podSecurity.version }}
    {{- end }}
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.monitoring }}
  labels:
    name: {{ .Values.namespaces.monitoring }}
    tier: observability
    {{- if .Values.podSecurity.enforce }}
    pod-security.kubernetes.io/enforce: {{ .Values.podSecurity.level }}
    pod-security.kubernetes.io/enforce-version: {{ .Values.podSecurity.version }}
    {{- end }}
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
{{- end }}
