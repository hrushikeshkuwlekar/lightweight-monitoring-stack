{{- if .Values.namespaces.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.app }}
  labels:
    name: {{ .Values.namespaces.app }}
    tier: application
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.monitoring }}
  labels:
    name: {{ .Values.namespaces.monitoring }}
    tier: observability
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
{{- end }}
