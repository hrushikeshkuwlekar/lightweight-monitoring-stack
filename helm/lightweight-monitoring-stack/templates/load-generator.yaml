{{- if .Values.loadGenerator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: {{ .Values.namespaces.app | default .Release.Namespace }}
  labels:
    app: load-generator
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.loadGenerator.replicaCount }}
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        {{- if not .Values.openshift }}
        runAsUser: 10001
        fsGroup: 10001
        {{- end }}
      containers:
      - name: load-generator
        image: "{{ .Values.loadGenerator.image.repository }}:{{ .Values.loadGenerator.image.tag | default .Chart.AppVersion }}"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        imagePullPolicy: {{ .Values.loadGenerator.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.loadGenerator.port }}
          name: http
        env:
        - name: TARGET_URL
          value: "http://demo-app-svc.{{ .Values.namespaces.app | default .Release.Namespace }}:{{ .Values.demoApp.port }}"
        resources:
          {{- include "lightweight-monitoring-stack.resources" (dict "ctx" . "component" "loadGenerator") | nindent 10 }}
        livenessProbe:
          httpGet:
            path: {{ .Values.loadGenerator.livenessProbe.path }}
            port: {{ .Values.loadGenerator.port }}
          initialDelaySeconds: {{ .Values.loadGenerator.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.loadGenerator.livenessProbe.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.loadGenerator.readinessProbe.path }}
            port: {{ .Values.loadGenerator.port }}
          initialDelaySeconds: {{ .Values.loadGenerator.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.loadGenerator.readinessProbe.periodSeconds }}
---
apiVersion: v1
kind: Service
metadata:
  name: load-generator-svc
  namespace: {{ .Values.namespaces.app | default .Release.Namespace }}
  labels:
    app: load-generator
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
spec:
  type: {{ include "lightweight-monitoring-stack.svcType" (list . .Values.loadGenerator.serviceType) }}
  ports:
  - port: {{ .Values.loadGenerator.port }}
    targetPort: {{ .Values.loadGenerator.port }}
    name: http
  selector:
    app: load-generator
{{- end }}
