{{- $mode := include "lightweight-monitoring-stack.nodeMetricsMode" . }}
{{- if eq $mode "daemonset" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: {{ .Values.namespaces.monitoring | default .Release.Namespace }}
  labels:
    app: cadvisor
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: cadvisor
  template:
    metadata:
      labels:
        app: cadvisor
    spec:
      hostNetwork: false
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      containers:
        - name: cadvisor
          image: "{{ .Values.cadvisor.image.repository }}:{{ .Values.cadvisor.image.tag }}"
          # cAdvisor resolves container metadata through containerd. Its socket
          # lives in different places per distro — plain containerd (kind, EKS,
          # GKE), k3s, or Docker 25+'s bundled containerd (OrbStack, Docker
          # Desktop). Pick the first one present unless explicitly configured.
          command: ["/bin/sh", "-c"]
          args:
            - |
              SOCK="{{ .Values.cadvisor.containerdSocket }}"
              if [ -z "$SOCK" ]; then
                for s in /rootfs/run/containerd/containerd.sock \
                         /rootfs/run/k3s/containerd/containerd.sock \
                         /rootfs/run/docker/containerd/containerd.sock; do
                  if [ -S "$s" ]; then SOCK="$s"; break; fi
                done
              fi
              echo "cadvisor: containerd socket = ${SOCK:-<cadvisor default>}"
              exec /usr/bin/cadvisor ${SOCK:+--containerd=$SOCK} \
                --housekeeping_interval={{ .Values.cadvisor.housekeepingInterval }} \
                --max_housekeeping_interval={{ .Values.cadvisor.maxHousekeepingInterval }} \
                --event_storage_event_limit=default=0 \
                --event_storage_age_limit=default=0 \
                --disable_metrics=percpu,sched,process,hugetlb,referenced_memory,resctrl,advtcp \
                --store_container_labels=false \
                --whitelisted_container_labels=io.kubernetes.pod.name,io.kubernetes.pod.namespace,io.kubernetes.container.name
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.cadvisor.resources.requests.cpu }}
              memory: {{ .Values.cadvisor.resources.requests.memory }}
            limits:
              cpu: {{ .Values.cadvisor.resources.limits.cpu }}
              memory: {{ .Values.cadvisor.resources.limits.memory }}
          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
            - name: var-run
              mountPath: /var/run
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: docker
              mountPath: /var/lib/docker
              readOnly: true
            - name: disk
              mountPath: /dev/disk
              readOnly: true
          securityContext:
            privileged: true
      volumes:
        - name: rootfs
          hostPath: { path: / }
        - name: var-run
          hostPath: { path: /var/run }
        - name: sys
          hostPath: { path: /sys }
        - name: docker
          hostPath: { path: /var/lib/docker }
        - name: disk
          hostPath: { path: /dev/disk }
---
apiVersion: v1
kind: Service
metadata:
  name: cadvisor-svc
  namespace: {{ .Values.namespaces.monitoring | default .Release.Namespace }}
  labels:
    app: cadvisor
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: cadvisor
{{- end }}
