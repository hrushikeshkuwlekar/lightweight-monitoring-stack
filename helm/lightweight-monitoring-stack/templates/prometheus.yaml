{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespaces.monitoring | default .Release.Namespace }}
  labels:
    app: prometheus
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.evaluationInterval }}

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: 'demo-app'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['demo-app-svc.{{ .Values.namespaces.app | default .Release.Namespace }}.svc:{{ .Values.demoApp.port }}']
            labels:
              app: 'demo-app'
              environment: 'helm-deploy'
              namespace: 'app'

{{- if .Values.loadGenerator.enabled }}
      - job_name: 'load-generator'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['load-generator-svc.{{ .Values.namespaces.app | default .Release.Namespace }}.svc:{{ .Values.loadGenerator.port }}']
            labels:
              app: 'load-generator'
              environment: 'helm-deploy'
              namespace: 'app'
{{- end }}

      - job_name: 'prometheus'
        scrape_interval: {{ .Values.prometheus.infraScrapeInterval }}
        static_configs:
          - targets: ['localhost:{{ .Values.prometheus.port }}']

{{- if .Values.kubeStateMetrics.enabled }}
      - job_name: 'kube-state-metrics'
        scrape_interval: {{ .Values.prometheus.infraScrapeInterval }}
        static_configs:
          - targets: ['kube-state-metrics-svc.{{ .Values.namespaces.monitoring | default .Release.Namespace }}.svc:8080']
{{- end }}

{{- $mode := include "lightweight-monitoring-stack.nodeMetricsMode" . }}

{{- if eq $mode "apiserver" }}
      - job_name: 'kubelet'
        scrape_interval: {{ .Values.prometheus.infraScrapeInterval }}
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      - job_name: 'cadvisor'
        scrape_interval: {{ .Values.prometheus.infraScrapeInterval }}
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
{{- end }}

{{- if eq $mode "direct" }}
      - job_name: 'kubelet'
        scrape_interval: {{ .Values.prometheus.infraScrapeInterval }}
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      - job_name: 'cadvisor'
        scrape_interval: {{ .Values.prometheus.infraScrapeInterval }}
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
{{- end }}

{{- if eq $mode "resource" }}
      - job_name: 'kubelet-resource'
        scrape_interval: {{ .Values.prometheus.infraScrapeInterval }}
        scheme: https
        metrics_path: /metrics/resource
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
{{- end }}

{{- if eq $mode "daemonset" }}
      - job_name: 'cadvisor-daemonset'
        scrape_interval: {{ .Values.prometheus.infraScrapeInterval }}
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['{{ .Values.namespaces.monitoring | default .Release.Namespace }}']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: cadvisor
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
{{- end }}

{{- if .Values.prometheus.externalTarget }}
      - job_name: 'external'
        static_configs:
          - targets: ['{{ .Values.prometheus.externalTarget }}']
            labels:
              source: 'external'
{{- end }}

  alerts.yml: |
    groups:
      - name: demo-app-alerts
        rules:
          - alert: HighErrorRate
            expr: sum(rate(http_requests_total{status_code=~"5.*"}[1m])) / sum(rate(http_requests_total[1m])) > 0.1
            for: 15s
            labels:
              severity: warning
            annotations:
              summary: "High error rate detected (>10% 5xx errors)"
              description: "App error rate exceeded threshold."

          - alert: LatencySpike
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 0.8
            for: 15s
            labels:
              severity: warning
            annotations:
              summary: "p95 Latency spike (>800ms)"
              description: "App response time is degraded."

          - alert: LoadGenHighErrorRate
            expr: sum(rate(loadgen_errors_total[1m])) / sum(rate(loadgen_requests_total[1m])) > 0.15
            for: 20s
            labels:
              severity: warning
            annotations:
              summary: "Load Generator reports elevated failure rate (>15%)"
              description: "Client-side errors exceed threshold during load test."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.namespaces.monitoring | default .Release.Namespace }}
  labels:
    app: prometheus
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        checksum/config: {{ printf "%v|%v|%v|%v|%v|%v|%v|%v|%v" .Values.prometheus.scrapeInterval .Values.prometheus.evaluationInterval .Values.prometheus.infraScrapeInterval .Values.prometheus.externalTarget .Values.loadGenerator.enabled .Values.kubeStateMetrics.enabled (include "lightweight-monitoring-stack.nodeMetricsMode" .) .Values.namespaces.app .Values.namespaces.monitoring | sha256sum | trunc 10 }}
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        {{- if not .Values.openshift }}
        runAsUser: 65534
        fsGroup: 65534
        {{- end }}
      containers:
      - name: prometheus
        image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
          - "--storage.tsdb.retention.time={{ .Values.prometheus.retention.time }}"
          - "--storage.tsdb.retention.size={{ .Values.prometheus.retention.size }}"
          - "--storage.tsdb.min-block-duration=2h"
          - "--storage.tsdb.max-block-duration=2h"
          - "--query.max-samples=200000"
          - "--web.enable-lifecycle"
        ports:
        - containerPort: {{ .Values.prometheus.port }}
          name: web
        resources:
          {{- include "lightweight-monitoring-stack.resources" (dict "ctx" . "component" "prometheus") | nindent 10 }}
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: {{ .Values.namespaces.monitoring | default .Release.Namespace }}
  labels:
    app: prometheus
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
spec:
  type: {{ include "lightweight-monitoring-stack.svcType" (list . .Values.prometheus.serviceType) }}
  ports:
  - port: {{ .Values.prometheus.port }}
    targetPort: {{ .Values.prometheus.port }}
    name: web
  selector:
    app: prometheus
{{- end }}
