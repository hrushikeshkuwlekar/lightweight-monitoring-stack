{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespaces.monitoring | default .Release.Namespace }}
  labels:
    app: prometheus
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
data:
  {{- include "lightweight-monitoring-stack.prometheusConfigData" . | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.namespaces.monitoring | default .Release.Namespace }}
  labels:
    app: prometheus
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        checksum/config: {{ include "lightweight-monitoring-stack.prometheusConfigData" . | sha256sum | trunc 10 }}
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        {{- if not .Values.openshift }}
        runAsUser: 65534
        fsGroup: 65534
        {{- end }}
      containers:
      - name: prometheus
        image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
          - "--storage.tsdb.retention.time={{ .Values.prometheus.retention.time }}"
          - "--storage.tsdb.retention.size={{ .Values.prometheus.retention.size }}"
          - "--storage.tsdb.min-block-duration=2h"
          - "--storage.tsdb.max-block-duration=2h"
          - "--query.max-samples=200000"
          - "--web.enable-lifecycle"
        ports:
        - containerPort: {{ .Values.prometheus.port }}
          name: web
        resources:
          {{- include "lightweight-monitoring-stack.resources" (dict "ctx" . "component" "prometheus") | nindent 10 }}
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: {{ .Values.namespaces.monitoring | default .Release.Namespace }}
  labels:
    app: prometheus
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
spec:
  type: {{ include "lightweight-monitoring-stack.svcType" (list . .Values.prometheus.serviceType) }}
  ports:
  - port: {{ .Values.prometheus.port }}
    targetPort: {{ .Values.prometheus.port }}
    name: web
  selector:
    app: prometheus
{{- end }}
