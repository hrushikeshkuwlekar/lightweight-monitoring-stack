{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Release.Namespace }}
  labels:
    app: grafana
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-svc:{{ .Values.prometheus.port }}
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: {{ .Release.Namespace }}
  labels:
    app: grafana
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    app: grafana
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
data:
  demo-app-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "⚡ Key Application Performance Indicators",
          "type": "row"
        },
        {
          "id": 1,
          "title": "Current Request Rate",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 1 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[1m]))",
              "legendFormat": "RPS",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "palette-classic" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Error Rate (%)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 1 },
          "targets": [
            {
              "expr": "clamp_min((sum(rate(http_requests_total{status_code=~\"5.*\"}[1m])) or vector(0)) / (sum(rate(http_requests_total[1m])) or vector(1)) * 100, 0)",
              "legendFormat": "Error %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 2 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "p95 Latency",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 1 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.3 },
                  { "color": "red", "value": 0.8 }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "Simulated Active Users",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 1 },
          "targets": [
            {
              "expr": "app_active_connections",
              "legendFormat": "Users",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "purple", "mode": "fixed" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "purple", "value": null }] }
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "id": 101,
          "title": "📈 Traffic and Latency Time Series",
          "type": "row"
        },
        {
          "id": 5,
          "title": "Requests Breakdown by Status Code",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 7 },
          "targets": [
            {
              "expr": "sum by (status_code) (rate(http_requests_total[1m]))",
              "legendFormat": "{{ "{{" }}status_code{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 15
              },
              "unit": "reqps"
            }
          }
        },
        {
          "id": 6,
          "title": "Response Latency Percentiles (p50 vs p95)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 7 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p95 Latency",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p50 Latency",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10
              },
              "unit": "s"
            }
          }
        },
        {
          "id": 7,
          "title": "App Memory Consumption",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 15 },
          "targets": [
            {
              "expr": "app_simulated_memory_mb",
              "legendFormat": "RAM (MB)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 150,
              "unit": "decmbytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 80 },
                  { "color": "red", "value": 120 }
                ]
              }
            }
          }
        },
        {
          "id": 8,
          "title": "Business Orders Processed by Tier",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 16, "x": 8, "y": 15 },
          "targets": [
            {
              "expr": "sum by (tier) (rate(app_business_orders_total[1m]))",
              "legendFormat": "{{ "{{" }}tier{{ "}}" }} tier",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 70
              },
              "unit": "ops"
            }
          }
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["monitoring", "demo"],
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m"]
      },
      "timezone": "browser",
      "title": "App Performance & Health",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels:
    app: grafana
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
        ports:
        - containerPort: {{ .Values.grafana.port }}
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: {{ .Values.grafana.adminUser | quote }}
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: {{ .Values.grafana.adminPassword | quote }}
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: {{ .Values.grafana.anonymousAuth | quote }}
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Admin"
        - name: GF_AUTH_DISABLE_LOGIN_FORM
          value: "false"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: "false"
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: "false"
        - name: GF_PLUGINS_PREINSTALL_DISABLED
          value: "true"
        - name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE
          value: "false"
        - name: GF_DATABASE_WAL
          value: "true"
        - name: GOMEMLIMIT
          value: "320MiB"
        - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
          value: "/var/lib/grafana/dashboards/demo-app-dashboard.json"
        resources:
          requests:
            cpu: {{ .Values.grafana.resources.requests.cpu }}
            memory: {{ .Values.grafana.resources.requests.memory }}
          limits:
            cpu: {{ .Values.grafana.resources.limits.cpu }}
            memory: {{ .Values.grafana.resources.limits.memory }}
        volumeMounts:
        - name: datasources-volume
          mountPath: /etc/grafana/provisioning/datasources
        - name: provider-volume
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards-volume
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: datasources-volume
        configMap:
          name: grafana-datasources
      - name: provider-volume
        configMap:
          name: grafana-dashboard-provider
      - name: dashboards-volume
        configMap:
          name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app: grafana
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.grafana.serviceType }}
  ports:
  - port: {{ .Values.grafana.port }}
    targetPort: {{ .Values.grafana.port }}
    name: http
  selector:
    app: grafana
{{- end }}
