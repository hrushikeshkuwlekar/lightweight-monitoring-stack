{{- if .Values.grafana.enabled }}
{{- $ns := .Values.namespaces.monitoring | default .Release.Namespace }}
{{- $existing := lookup "v1" "Secret" $ns "grafana-admin" }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "admin-password" | b64dec }}
{{- else }}
{{- $password = .Values.grafana.adminPassword }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: {{ $ns }}
  labels:
    app: grafana
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ .Values.grafana.adminUser | quote }}
  admin-password: {{ $password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.namespaces.monitoring | default .Release.Namespace }}
  labels:
    app: grafana
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-svc.{{ .Values.namespaces.monitoring | default .Release.Namespace }}:{{ .Values.prometheus.port }}
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: {{ .Values.namespaces.monitoring | default .Release.Namespace }}
  labels:
    app: grafana
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'app'
        orgId: 1
        folder: 'Demo App'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/app
      - name: 'kubernetes'
        orgId: 1
        folder: 'Kubernetes'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/kubernetes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-app
  namespace: {{ .Values.namespaces.monitoring | default .Release.Namespace }}
  labels:
    app: grafana
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
binaryData:
  demo-app-dashboard.json: {{ .Files.Get "files/dashboards/demo-app-dashboard.json" | b64enc }}
  loadgen-dashboard.json: {{ .Files.Get "files/dashboards/loadgen-dashboard.json" | b64enc }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-kubernetes
  namespace: {{ .Values.namespaces.monitoring | default .Release.Namespace }}
  labels:
    app: grafana
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
binaryData:
  k8s-pods-dashboard.json: {{ .Files.Get "files/dashboards/k8s-pods-dashboard.json" | b64enc }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.namespaces.monitoring | default .Release.Namespace }}
  labels:
    app: grafana
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        ports:
        - containerPort: {{ .Values.grafana.port }}
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: admin-user
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: admin-password
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: {{ include "lightweight-monitoring-stack.grafanaAnonymousAuth" . | quote }}
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Admin"
        - name: GF_AUTH_DISABLE_LOGIN_FORM
          value: "false"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: "false"
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: "false"
        - name: GF_PLUGINS_PREINSTALL_DISABLED
          value: "true"
        - name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE
          value: "false"
        - name: GF_DATABASE_WAL
          value: "true"
        - name: GOMEMLIMIT
          value: "320MiB"
        - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
          value: "/var/lib/grafana/dashboards/app/demo-app-dashboard.json"
        resources:
          requests:
            cpu: {{ .Values.grafana.resources.requests.cpu }}
            memory: {{ .Values.grafana.resources.requests.memory }}
          limits:
            cpu: {{ .Values.grafana.resources.limits.cpu }}
            memory: {{ .Values.grafana.resources.limits.memory }}
        volumeMounts:
        - name: datasources-volume
          mountPath: /etc/grafana/provisioning/datasources
        - name: provider-volume
          mountPath: /etc/grafana/provisioning/dashboards
        - name: data
          mountPath: /var/lib/grafana
        - name: dashboards-app
          mountPath: /var/lib/grafana/dashboards/app
        - name: dashboards-kubernetes
          mountPath: /var/lib/grafana/dashboards/kubernetes
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: datasources-volume
        configMap:
          name: grafana-datasources
      - name: provider-volume
        configMap:
          name: grafana-dashboard-provider
      - name: dashboards-app
        configMap:
          name: grafana-dashboards-app
      - name: dashboards-kubernetes
        configMap:
          name: grafana-dashboards-kubernetes
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-svc
  namespace: {{ .Values.namespaces.monitoring | default .Release.Namespace }}
  labels:
    app: grafana
    {{- include "lightweight-monitoring-stack.labels" . | nindent 4 }}
spec:
  type: {{ include "lightweight-monitoring-stack.svcType" (list . .Values.grafana.serviceType) }}
  ports:
  - port: {{ .Values.grafana.port }}
    targetPort: {{ .Values.grafana.port }}
    name: http
  selector:
    app: grafana
{{- end }}
