## @param expose.type Override the Kubernetes Service type for every component at once.
## Valid values: LoadBalancer, NodePort, ClusterIP, "".
## When empty (default) each component uses its own serviceType value.
## Example: --set expose.type=ClusterIP disables all LoadBalancer services.
expose:
  type: ""

## @section Node metrics configuration
## @param nodeMetrics.mode How to scrape Kubernetes node / container metrics.
## Options:
##   off        — no node scraping (default; safe for resource-constrained clusters)
##   apiserver  — scrape kubelet via the API server node proxy (requires RBAC; ~35k series on k3s)
##   direct     — scrape kubelet directly (port 10250; requires network access)
##   resource   — scrape /metrics/resource only (CPU + memory; ~50 series; best for laptops)
##   daemonset  — deploy a cAdvisor DaemonSet (full container_* metrics on any node)
nodeMetrics:
  mode: "off"

## @param profile Set to 'laptop' to preserve demo-safe defaults regardless of other overrides.
## The laptop profile forces: scrapeKubelet=false, prometheus memory limit=256Mi,
## grafana anonymousAuth=true, and expose via LoadBalancer.
profile: ""

## @section Namespaces configuration
namespaces:
  ## @param namespaces.create Create namespaces automatically
  create: true
  ## @param namespaces.app Namespace for application workloads (demo-app, load-generator)
  app: "app"
  ## @param namespaces.monitoring Namespace for monitoring stack (prometheus, grafana)
  monitoring: "monitoring"

## @section Demo App parameters
demoApp:
  ## @param demoApp.replicaCount Number of demo-app replicas
  replicaCount: 1
  image:
    ## @param demoApp.image.repository Docker image repository
    repository: ghcr.io/hrushikeshkuwlekar/lightweight-monitoring-stack
    ## @param demoApp.image.tag Docker image tag (defaults to Chart appVersion)
    tag: ""
    ## @param demoApp.image.pullPolicy Image pull policy
    pullPolicy: IfNotPresent
  ## @param demoApp.port Container port for the FastAPI app
  port: 8000
  ## @param demoApp.serviceType Kubernetes service type
  serviceType: LoadBalancer
  resources:
    requests:
      cpu: 20m
      memory: 40Mi
    limits:
      cpu: 100m
      memory: 80Mi
  livenessProbe:
    path: /healthz
    initialDelaySeconds: 3
    periodSeconds: 10
  readinessProbe:
    path: /healthz
    initialDelaySeconds: 2
    periodSeconds: 5

## @section Load Generator parameters
loadGenerator:
  ## @param loadGenerator.enabled Enable Load Generator deployment
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/hrushikeshkuwlekar/lightweight-monitoring-stack-loadgen
    tag: ""
    pullPolicy: IfNotPresent
  port: 8089
  serviceType: LoadBalancer
  resources:
    requests:
      cpu: 20m
      memory: 40Mi
    limits:
      cpu: 200m
      memory: 100Mi
  livenessProbe:
    path: /health
    initialDelaySeconds: 3
    periodSeconds: 10
  readinessProbe:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 5

## @section Kube State Metrics parameters
kubeStateMetrics:
  ## @param kubeStateMetrics.enabled Enable kube-state-metrics (provides kube_pod_info, kube_node_info, etc.)
  enabled: true
  image:
    repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: v2.13.0
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

## @section Prometheus parameters
prometheus:
  ## @param prometheus.enabled Enable Prometheus deployment
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.55.0
  port: 9090
  serviceType: LoadBalancer
  scrapeInterval: 5s
  evaluationInterval: 5s
  retention:
    time: 2h
    size: 100MB
  resources:
    requests:
      cpu: 30m
      memory: 60Mi
    limits:
      cpu: 200m
      memory: 256Mi

## @section Grafana parameters
grafana:
  ## @param grafana.enabled Enable Grafana deployment
  enabled: true
  image:
    repository: grafana/grafana-oss
    tag: 11.3.0
  port: 3000
  serviceType: LoadBalancer
  ## @param grafana.anonymousAuth Enable anonymous admin access (no login required)
  anonymousAuth: true
  ## @param grafana.adminUser Default admin username
  adminUser: "admin"
  ## @param grafana.adminPassword Default admin password
  adminPassword: "password"
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 400Mi
