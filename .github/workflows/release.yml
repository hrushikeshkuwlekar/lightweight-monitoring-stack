# =============================================================================
# CI/CD: Build Docker images → Push to GHCR → Package Helm chart → Publish to GH Pages
# =============================================================================
# Triggers on push to 'main' branch or tag creation (v*)
# Produces:
#   1. App Docker image: ghcr.io/<repo>:<tag>
#   2. Load Generator Docker image: ghcr.io/<repo>-loadgen:<tag>
#   3. Helm chart hosted on GitHub Pages (gh-pages branch)
# =============================================================================
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write      # push to gh-pages
  packages: write      # push Docker images to GHCR
  id-token: write      # OIDC signing

jobs:
  # ─────────────────────────────────────────────────
  # Job 1: Build and push multi-arch Docker images
  # ─────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Demo App Image ---
      - name: Docker metadata (demo-app)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (demo-app)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Load Generator Image ---
      - name: Docker metadata (load-generator)
        id: meta_loadgen
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-loadgen
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (load-generator)
        uses: docker/build-push-action@v5
        with:
          context: ./load-generator
          file: ./load-generator/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_loadgen.outputs.tags }}
          labels: ${{ steps.meta_loadgen.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────
  # Job 2: Package Helm chart and publish to GH Pages
  # ─────────────────────────────────────────────────
  helm:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: |
          helm package helm/lightweight-monitoring-stack \
            --destination .helm-packages

      - name: Publish Helm chart to GitHub Pages
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: helm
          pages_branch: gh-pages
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
