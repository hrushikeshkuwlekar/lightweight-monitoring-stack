# =============================================================================
# CI/CD: Build Docker images → Push to GHCR → Package Helm chart → Publish to GH Pages
# =============================================================================
# Triggers on push to 'main' branch or tag creation (v*)
# Produces:
#   1. App Docker image: ghcr.io/<repo>:<tag>
#   2. Load Generator Docker image: ghcr.io/<repo>-loadgen:<tag>
#   3. Helm chart hosted on GitHub Pages (gh-pages branch)
# =============================================================================
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write      # push to gh-pages
  packages: write      # push Docker images to GHCR
  id-token: write      # OIDC signing

jobs:
  # ─────────────────────────────────────────────────
  # Job 1: Build and push multi-arch Docker images
  # ─────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Demo App Image ---
      - name: Docker metadata (demo-app)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (demo-app)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Load Generator Image ---
      - name: Docker metadata (load-generator)
        id: meta_loadgen
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-loadgen
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (load-generator)
        uses: docker/build-push-action@v5
        with:
          context: ./load-generator
          file: ./load-generator/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_loadgen.outputs.tags }}
          labels: ${{ steps.meta_loadgen.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────
  # Job 2: Package Helm chart and publish to GH Pages
  # Deterministic + self-healing: repackages the current chart, drops it
  # into gh-pages alongside existing packages, and regenerates the full
  # index.yaml from every .tgz present. No tag-diff discovery.
  # ─────────────────────────────────────────────────
  helm:
    runs-on: ubuntu-latest
    needs: docker
    concurrency:
      group: helm-pages-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package chart and publish to GitHub Pages
        env:
          REPO_URL: https://hrushikeshkuwlekar.github.io/lightweight-monitoring-stack
        run: |
          set -euo pipefail

          # Package the current chart version
          mkdir -p .deploy
          helm package helm/lightweight-monitoring-stack --destination .deploy

          # Mount the existing gh-pages branch in a worktree
          git fetch origin gh-pages
          git worktree add gh-pages origin/gh-pages

          # Add freshly packaged chart(s), overwriting a same-version package
          cp -f .deploy/*.tgz gh-pages/

          # Rebuild the repo index from ALL packages present (self-healing:
          # prunes stale entries, restores any missing URLs)
          helm repo index gh-pages --url "$REPO_URL"

          cd gh-pages
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No chart changes to publish."
          else
            git commit -m "Publish Helm chart packages and regenerate index"
            git push origin HEAD:gh-pages
          fi

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          CHART_TGZ=$(ls .deploy/*.tgz | head -1)
          CHART_VERSION="${TAG#v}"
          # Idempotent: create if missing, otherwise just upload the asset.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading chart asset."
            gh release upload "$TAG" "$CHART_TGZ" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$CHART_TGZ" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "Lightweight Monitoring Stack chart \`$CHART_VERSION\`.

Install:
\`\`\`
helm repo add lightweight-monitoring https://hrushikeshkuwlekar.github.io/lightweight-monitoring-stack/
helm repo update
helm install demo lightweight-monitoring/lightweight-monitoring-stack --version $CHART_VERSION
\`\`\`

See the commit log for what changed in this version."
          fi
