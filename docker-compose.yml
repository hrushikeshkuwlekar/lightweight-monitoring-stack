version: "3.8"

services:
  demo-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: demo-app:v1
    container_name: demo-app
    ports:
      - "8000:8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 80M
        reservations:
          cpus: "0.05"
          memory: 40M

  load-generator:
    build:
      context: ./load-generator
      dockerfile: Dockerfile
    image: load-generator:v1
    container_name: load-generator
    environment:
      - TARGET_URL=http://demo-app:8000
    ports:
      - "8089:8089"
    depends_on:
      - demo-app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 100M
        reservations:
          cpus: "0.05"
          memory: 50M

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2h"
      - "--storage.tsdb.retention.size=100MB"
      - "--storage.tsdb.min-block-duration=2h"
      - "--storage.tsdb.max-block-duration=2h"
      - "--query.max-samples=200000"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 120M
        reservations:
          cpus: "0.05"
          memory: 60M

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=password
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
      - GF_DATABASE_WAL=true
      - GOMEMLIMIT=320MiB
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/demo-app-dashboard.json
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 400M
        reservations:
          cpus: "0.05"
          memory: 100M
